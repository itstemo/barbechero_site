<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>body{margin:0;background:#f7f5ee;font-family:sans-serif}#out>div{margin:8px}</style>
</head><body>
<div id="out"></div>
<script>
const LOTS = [
  {key:'espadin-mexicano', label:'SIERRA NORTE, GUERRERO', lon:-99.55, lat:18.35, color:'oklch(0.52 0.11 40)'},
  {key:'cupreata',         label:'SAN MIGUEL DE LAS PALMAS, GUERRERO', lon:-99.30, lat:17.95, color:'oklch(0.52 0.11 250)'},
  {key:'coyote',           label:'PALO GRANDE, MIAHUATLÁN, OAXACA', lon:-96.55, lat:16.30, color:'oklch(0.52 0.11 115)'}
];
const W=760,H=470, INK='#211d17';
(async ()=>{
  const topo = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
  const countries = topojson.feature(topo, topo.objects.countries);
  const mexico = countries.features.find(f=>f.properties.name==='Mexico');
  const inBox=f=>{const b=d3.geoBounds(f);return b[0][0]<-92.5&&b[1][0]>-104?true:(b[1][0]>-104&&b[0][0]<-92.5&&b[1][1]>14&&b[0][1]<21.5);};
  const others = countries.features.filter(f=>f.properties.name!=='Mexico'&&d3.geoBounds(f)[1][0]>-104&&d3.geoBounds(f)[0][0]<-92.5&&d3.geoBounds(f)[1][1]>14&&d3.geoBounds(f)[0][1]<21.5);
  const bbox = {type:'LineString', coordinates:[[-106.5,13.4],[-89.5,23.2]]};

  for (const focus of [null, ...LOTS]) {
    const svg = d3.create('svg').attr('xmlns','http://www.w3.org/2000/svg')
      .attr('viewBox',`0 0 ${W} ${H}`).attr('width',W).attr('height',H);
    const proj = d3.geoMercator().fitExtent([[24,24],[W-24,H-24]], bbox);
    proj.clipExtent([[0,0],[W,H]]);
    const path = d3.geoPath(proj).digits(1);
    // graticule, very light
    svg.append('path').attr('d', path(d3.geoGraticule().step([2,2]).extent([[-106,13],[-90,23]])()))
      .attr('fill','none').attr('stroke',INK).attr('stroke-width',.3).attr('opacity',.16);
    svg.append('g').selectAll('path').data(others).join('path').attr('d',path)
      .attr('fill','none').attr('stroke',INK).attr('stroke-width',.6).attr('opacity',.25);
    svg.append('path').attr('d',path(mexico)).attr('fill','none').attr('stroke',INK).attr('stroke-width',1.2);
    LOTS.forEach(l=>{
      const [x,y]=proj([l.lon,l.lat]);
      const on = !focus || focus.key===l.key;
      const g = svg.append('g').attr('opacity', on?1:.28);
      if(on){ g.append('circle').attr('cx',x).attr('cy',y).attr('r',13).attr('fill','none').attr('stroke',l.color).attr('stroke-width',.8).attr('opacity',.55); }
      g.append('circle').attr('cx',x).attr('cy',y).attr('r',on?4.6:3).attr('fill', on?l.color:INK);
      if(on){
        const dy = l.key==='cupreata' ? 96 : (l.key==='coyote' ? -58 : 44);
        g.append('line').attr('x1',x).attr('y1',y).attr('x2',x).attr('y2',y-dy).attr('stroke',INK).attr('stroke-width',.6);
        g.append('text').attr('x',x).attr('y',dy<0 ? y-dy+13 : y-dy-8).attr('text-anchor','middle')
          .attr('font-family',"'IBM Plex Mono',ui-monospace,monospace").attr('font-size',10.5)
          .attr('letter-spacing','1.2').attr('fill',INK).text(l.label);
      }
    });
    const wrap = document.createElement('div');
    wrap.id = 'map-'+(focus?focus.key:'all');
    wrap.appendChild(svg.node());
    document.getElementById('out').appendChild(wrap);
  }
  window.__ready = true;
})();
</script>
</body></html>
